[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/PraneeshRV/Project-Muginn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
regex = "1"
chrono = "0.4"
dirs-next = "2"
tokio = { version = "=1.40.0", features = ["full"] }
rmcp = { version = "0.1", features = ["server"] }
toml = "0.8"

# cargo-dist config lives in ../dist-workspace.toml (the Cargo workspace is nested
# under muginn/, so cargo-dist is rooted at the repo root, not here).

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
